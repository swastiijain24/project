{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Links | {{ user.first_name }}</title>
    <link href="{% static 'assets/images/favicon.png' %}" rel="icon" type="image/png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'cssfiles/settings.css' %}">
</head>

<body class="settings-page">
    <!-- Header -->
    <div class="settings-header">
        <div class="container">
            <div class="breadcrumb">
                <a href="{% url 'index' %}"><i class="bi bi-house me-1"></i>Home</a>
                <span>/</span>
                <span>Social Links</span>
            </div>
            <h1>🔗 Social Links</h1>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container settings-container">
        <!-- Navigation Tabs -->
        <nav class="settings-nav">
            <a href="{% url 'settings' user.id %}" class="nav-tab">
                <i class="bi bi-person me-2"></i>General
            </a>
            <a href="{% url 'profile' user.id %}" class="nav-tab">
                <i class="bi bi-card-heading me-2"></i>Profile
            </a>
            <a href="#" class="nav-tab">
                <i class="bi bi-bell me-2"></i>Notification
            </a>
            <a href="{% url 'social_links' user.id %}" class="nav-tab active">
                <i class="bi bi-link-45deg me-2"></i>Social Links
            </a>
        </nav>

        <div class="row">
            <!-- Main Form -->
            <div class="col-lg-8">
                <div class="settings-card">
                    <div class="card-header">
                        <h2>Social Media Links</h2>
                        <p>Connect your social media profiles</p>
                    </div>

                    <form action="" method="POST">
                        {% csrf_token %}

                        <div class="card-body">
                            <!-- Instagram -->
                            <div class="form-group">
                                <label class="form-label">
                                    <i class="bi bi-instagram me-2" style="color: #E4405F;"></i>Instagram
                                </label>
                                <input type="url" name="instagram" class="form-control" value="{{ profile.instagram }}"
                                    placeholder="https://instagram.com/username">
                            </div>

                            <!-- LinkedIn -->
                            <div class="form-group">
                                <label class="form-label">
                                    <i class="bi bi-linkedin me-2" style="color: #0A66C2;"></i>LinkedIn
                                </label>
                                <input type="url" name="linkedin" class="form-control" value="{{ profile.linkedin }}"
                                    placeholder="https://linkedin.com/in/username">
                            </div>

                            <!-- GitHub -->
                            <div class="form-group">
                                <label class="form-label">
                                    <i class="bi bi-github me-2"></i>GitHub
                                </label>
                                <input type="url" name="github" class="form-control" value="{{ profile.github }}"
                                    placeholder="https://github.com/username">
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="button-group">
                            <a href="{% url 'settings' user.id %}" class="btn btn-cancel">
                                <i class="bi bi-x-lg"></i>
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-save">
                                <i class="bi bi-check-lg"></i>
                                Save Links
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
