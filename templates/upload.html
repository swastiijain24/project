{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - Upload</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/upload.css' %}">
</head>

<body>
    <div class="container">
        <form action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="card">
                <div class="card-header">
                    <h1 class="card-title">Create New Post</h1>
                    <p class="card-subtitle">Share your moments with the world</p>
                </div>

                <div class="card-body">
                    <!-- Upload Zone -->
                    <label for="fileInput" class="upload-zone">
                        <div class="upload-icon-wrapper">
                            <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                            </svg>
                        </div>

                        <div class="upload-text">
                            <h3>Drop your image here</h3>
                            <p>or click to browse from your device</p>
                        </div>

                        <input type="file" name="postimage" id="fileInput" class="file-input" accept="image/*" required>

                        <span class="choose-file-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            Choose File
                        </span>
                    </label>

                    <!-- Caption Section -->
                    <div class="caption-section">
                        <label for="caption" class="caption-label">
                            <svg style="display: inline; width: 18px; height: 18px; margin-right: 4px; vertical-align: text-bottom;"
                                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                            </svg>
                            Add Caption
                        </label>
                        <textarea id="caption" name="caption" class="caption-textarea"
                            placeholder="What's on your mind? Share your story..." maxlength="2200"></textarea>
                    </div>

                    <!-- Tags Section -->
                    <div class="tags-section">
                        <label class="tags-label">
                            <svg style="display: inline; width: 18px; height: 18px; margin-right: 4px; vertical-align: text-bottom;"
                                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
                            </svg>
                            Add Tags
                            <span class="tag-count" id="tagCount">(0/5 selected)</span>
                        </label>

                        <div class="tags-grid">
                            {% for tag in tags %}
                            <label class="tag-checkbox">
                                <input type="checkbox" name="tags" value="{{ tag.id }}" class="tag-input">
                                <span class="tag-box">{{ tag.name }}</span>
                            </label>
                            {% endfor %}
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="button-group">
                        <a href="{% url 'index' %}" class="btn btn-secondary">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg>
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <!-- <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                            </svg> -->
                            Upload
                        </button>
                    </div>
                </div>

                <div class="card-footer">
                    <svg class="info-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>Maximum file size: 999 MB</span>
                </div>
            </div>
        </form>
    </div>
    <script>
        // Tag selection limit (max 5)
        const tagInputs = document.querySelectorAll('.tag-input');
        const tagCount = document.getElementById('tagCount');

        tagInputs.forEach(input => {
            input.addEventListener('change', function () {
                const checkedCount = document.querySelectorAll('.tag-input:checked').length;

                // Update counter
                tagCount.textContent = `(${checkedCount}/5 selected)`;

                // Disable unchecked boxes if limit reached
                if (checkedCount >= 5) {
                    tagInputs.forEach(checkbox => {
                        if (!checkbox.checked) {
                            checkbox.disabled = true;
                        }
                    });
                } else {
                    tagInputs.forEach(checkbox => {
                        checkbox.disabled = false;
                    });
                }
            });
        });
    </script>
</body>

</html>
