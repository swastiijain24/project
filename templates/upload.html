{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post | Upload</title>
    <link href="{% static 'favicon.png' %}" rel="icon" type="image/png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'cssfiles/upload.css' %}">
</head>

<body class="upload-page">
    <div class="upload-container">
        <form action="" method="POST" enctype="multipart/form-data" id="uploadForm">
            {% csrf_token %}

            <div class="upload-card">
                <!-- Header -->
                <div class="upload-header">
                    <h1>Create New Post</h1>
                    <p>Share your moments with the world</p>
                </div>

                <!-- Body -->
                <div class="upload-body">
                    <!-- Upload Zone -->
                    <label for="fileInput" class="upload-zone" id="uploadZone">
                        <div class="upload-icon">
                            <i class="bi bi-cloud-arrow-up"></i>
                        </div>
                        <h3>Drop your image here</h3>
                        <p>or click to browse from your device</p>
                        <span class="browse-btn">
                            <i class="bi bi-folder2-open me-2"></i>Choose File
                        </span>
                        <input type="file" name="postimage" id="fileInput" class="file-input" accept="image/*" required>
                    </label>

                    <!-- Image Preview -->
                    <div class="image-preview-container" id="previewContainer">
                        <div class="image-preview-wrapper">
                            <img src="" alt="Preview" class="image-preview" id="imagePreview">
                            <button type="button" class="remove-image-btn" id="removeImage">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                        <div class="file-name" id="fileName"></div>
                    </div>

                    <!-- Caption -->
                    <div class="form-group">
                        <label class="form-label">
                            <i class="bi bi-pencil-square"></i>
                            Caption
                        </label>
                        <textarea name="caption" class="form-control" rows="3"
                            placeholder="What's on your mind? Share your story..." maxlength="2200"></textarea>
                    </div>

                    <!-- Tags -->
                    <div class="form-group">
                        <label class="form-label">
                            <i class="bi bi-tags"></i>
                            Add Tags
                            <span class="tag-count" id="tagCount">(0/5 selected)</span>
                        </label>
                        <div class="tags-grid">
                            {% for tag in tags %}
                            <label class="tag-checkbox">
                                <input type="checkbox" name="tags" value="{{ tag.id }}" class="tag-input">
                                <span class="tag-box">{{ tag.name }}</span>
                            </label>
                            {% endfor %}
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="button-group">
                        <a href="{% url 'index' %}" class="btn btn-cancel">
                            <i class="bi bi-arrow-left"></i>
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-upload">
                            <i class="bi bi-cloud-upload"></i>
                            Upload Post
                        </button>
                    </div>
                </div>

                <!-- Footer -->
                <div class="upload-footer">
                    <i class="bi bi-info-circle"></i>
                    <span>Maximum file size: 999 MB</span>
                </div>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script>
        // DOM Elements
        const fileInput = document.getElementById('fileInput');
        const uploadZone = document.getElementById('uploadZone');
        const previewContainer = document.getElementById('previewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const fileName = document.getElementById('fileName');
        const removeImageBtn = document.getElementById('removeImage');
        const tagInputs = document.querySelectorAll('.tag-input');
        const tagCount = document.getElementById('tagCount');

        // File Input Change Handler - Show Preview
        fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                showPreview(file);
            }
        });

        // Show Image Preview
        function showPreview(file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                imagePreview.src = e.target.result;
                fileName.textContent = file.name;
                uploadZone.style.display = 'none';
                previewContainer.classList.add('show');
            };
            reader.readAsDataURL(file);
        }

        // Remove Image
        removeImageBtn.addEventListener('click', function () {
            fileInput.value = '';
            imagePreview.src = '';
            fileName.textContent = '';
            previewContainer.classList.remove('show');
            uploadZone.style.display = 'block';
        });

        // Drag and Drop
        uploadZone.addEventListener('dragover', function (e) {
            e.preventDefault();
            this.classList.add('drag-over');
        });

        uploadZone.addEventListener('dragleave', function (e) {
            e.preventDefault();
            this.classList.remove('drag-over');
        });

        uploadZone.addEventListener('drop', function (e) {
            e.preventDefault();
            this.classList.remove('drag-over');

            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type.startsWith('image/')) {
                fileInput.files = files;
                showPreview(files[0]);
            }
        });

        // Tag Selection Limit (max 5)
        tagInputs.forEach(input => {
            input.addEventListener('change', function () {
                const checkedCount = document.querySelectorAll('.tag-input:checked').length;

                // Update counter
                tagCount.textContent = `(${checkedCount}/5 selected)`;

                // Disable unchecked boxes if limit reached
                if (checkedCount >= 5) {
                    tagInputs.forEach(checkbox => {
                        if (!checkbox.checked) {
                            checkbox.disabled = true;
                        }
                    });
                } else {
                    tagInputs.forEach(checkbox => {
                        checkbox.disabled = false;
                    });
                }
            });
        });
    </script>
</body>

</html>
